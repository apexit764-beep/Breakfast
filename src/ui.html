<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: Inter, system-ui, -apple-system, sans-serif;
    font-size: 13px;
    color: var(--figma-color-text, #333);
    background: var(--figma-color-bg, #fff);
    padding: 16px;
    direction: rtl;
  }
  h2 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 16px;
    text-align: center;
  }
  .section {
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
    font-size: 12px;
    color: var(--figma-color-text-secondary, #666);
  }
  select, input[type="number"] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--figma-color-border, #ddd);
    border-radius: 6px;
    background: var(--figma-color-bg, #fff);
    color: var(--figma-color-text, #333);
    font-size: 13px;
    direction: ltr;
  }
  select:focus, input:focus {
    outline: none;
    border-color: #0d99ff;
    box-shadow: 0 0 0 2px rgba(13, 153, 255, 0.2);
  }
  .btn {
    display: block;
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-primary {
    background: #0d99ff;
    color: #fff;
  }
  .btn-primary:hover {
    background: #0b87e0;
  }
  .btn-primary:disabled {
    background: #999;
    cursor: not-allowed;
  }
  .btn-success {
    background: #14ae5c;
    color: #fff;
    margin-top: 8px;
  }
  .btn-success:hover {
    background: #119a4f;
  }
  .btn-success:disabled {
    background: #999;
    cursor: not-allowed;
  }
  .btn-secondary {
    background: transparent;
    color: var(--figma-color-text-secondary, #666);
    border: 1px solid var(--figma-color-border, #ddd);
    margin-top: 8px;
  }
  .btn-secondary:hover {
    background: var(--figma-color-bg-hover, #f5f5f5);
  }
  #progress-area {
    display: none;
    margin: 16px 0;
  }
  .progress-track {
    width: 100%;
    height: 6px;
    background: var(--figma-color-border, #e5e5e5);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .progress-fill {
    height: 100%;
    background: #0d99ff;
    border-radius: 3px;
    width: 0%;
    transition: width 0.2s;
  }
  #progress-text {
    font-size: 12px;
    color: var(--figma-color-text-secondary, #666);
    text-align: center;
  }
  .status {
    display: none;
    padding: 10px 12px;
    border-radius: 6px;
    margin: 12px 0;
    font-size: 12px;
    text-align: center;
  }
  .status.error {
    background: #fee;
    color: #c00;
    border: 1px solid #fcc;
  }
  .status.success {
    background: #efe;
    color: #080;
    border: 1px solid #cfc;
  }
  #render-section {
    display: none;
  }
  #frame-info {
    text-align: center;
    font-size: 12px;
    color: var(--figma-color-text-secondary, #666);
    margin-bottom: 8px;
    direction: ltr;
  }
  .help-text {
    font-size: 11px;
    color: var(--figma-color-text-tertiary, #999);
    margin-top: 4px;
  }
  .row {
    display: flex;
    gap: 12px;
  }
  .row > .section {
    flex: 1;
  }
</style>

<h2>تصدير البروتوتايب كفيديو</h2>

<div class="section">
  <label>جودة التصدير</label>
  <select id="scale">
    <option value="1">1x — سريع</option>
    <option value="2">2x — متوسط</option>
    <option value="3">3x — عالي</option>
    <option value="4" selected>4x — أعلى جودة</option>
  </select>
</div>

<div class="row">
  <div class="section">
    <label>مدة احتياطية (ms)</label>
    <input type="number" id="hold-duration" value="1000" min="100" max="10000" step="100" />
    <p class="help-text">تُستخدم فقط إذا ما في After Delay في البروتوتايب</p>
  </div>
  <div class="section">
    <label>جودة الفيديو (Bitrate)</label>
    <select id="bitrate">
      <option value="5000000">5 Mbps — متوسط</option>
      <option value="10000000">10 Mbps — عالي</option>
      <option value="20000000" selected>20 Mbps — عالي جداً</option>
      <option value="40000000">40 Mbps — أقصى جودة</option>
    </select>
  </div>
</div>

<button id="export-btn" class="btn btn-primary">قراءة البروتوتايب</button>

<div id="progress-area">
  <div class="progress-track">
    <div class="progress-fill" id="progress-bar"></div>
  </div>
  <div id="progress-text"></div>
</div>

<div id="status" class="status"></div>

<div id="render-section">
  <div id="frame-info"></div>
  <button id="render-btn" class="btn btn-success">تصدير فيديو</button>
</div>

<button id="cancel-btn" class="btn btn-secondary">إلغاء</button>
